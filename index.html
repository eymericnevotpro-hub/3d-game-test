<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Game Test — Coop City</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: system-ui, sans-serif; }
      canvas { display: block; }

      #overlay {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        color: white;
        cursor: pointer;
        z-index: 10;
        text-align: center;
      }
      #overlay.hidden { display: none; }
      #overlay .box {
        padding: 32px 40px;
        background: rgba(20, 20, 30, 0.75);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 12px;
        max-width: 420px;
      }
      #overlay h1 { font-size: 22px; margin-bottom: 12px; }
      #overlay p { font-size: 14px; line-height: 1.5; opacity: 0.9; }
      #overlay kbd {
        background: #2b2b3a; padding: 2px 6px; border-radius: 4px;
        border: 1px solid rgba(255,255,255,0.2); font-family: monospace;
      }

      #hud {
        position: fixed; bottom: 16px; left: 16px;
        color: rgba(255,255,255,0.85);
        font-size: 12px; font-family: monospace;
        background: rgba(0,0,0,0.35);
        padding: 8px 12px; border-radius: 6px;
        pointer-events: none;
      }
      #crosshair {
        position: fixed; top: 50%; left: 50%;
        width: 4px; height: 4px;
        background: white; border-radius: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <div class="box">
        <h1>3D Game Test</h1>
        <p>
          Clique pour jouer.<br /><br />
          <kbd>Z</kbd> <kbd>Q</kbd> <kbd>S</kbd> <kbd>D</kbd> pour bouger<br />
          Souris pour regarder<br />
          <kbd>Échap</kbd> pour libérer le curseur
        </p>
      </div>
    </div>
    <div id="crosshair"></div>
    <div id="hud">ZQSD pour bouger · Souris pour regarder</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
